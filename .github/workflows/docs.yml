# Build the Sphinx documentation and publish it to GitHub Pages.
#
# One manual step, once per repository: Settings -> Pages -> Source: "GitHub
# Actions"; without it the deploy job fails with a 404 from the Pages API.
# sphinx.ext.githubpages writes .nojekyll, so _static and _sources are served.
#
# Action pins verified 2026-09-05 as in ci.yml: Node 24 runtimes, and
# astral-sh/setup-uv pinned to the exact release because it publishes no
# floating major tag.

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-finished
# deploy would leave the published site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install doxygen
        run: |
          set -euo pipefail
          # conf.py runs doxygen during the sphinx build.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync the Python environment
        run: |
          set -euo pipefail
          # --locked only once a lock file is committed.
          if [ -f uv.lock ]; then
            uv sync --locked --extra docs
          else
            uv sync --extra docs
          fi

      # --no-sync: a bare `uv run` would re-sync without the docs extra and
      # remove sphinx out from under this command.
      - name: sphinx-build
        run: |
          uv run --no-sync sphinx-build -W --keep-going -b html \
            docs docs/_build/html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
