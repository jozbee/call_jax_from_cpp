# Lint, build the documentation, and run the test suite in the project's
# Docker image on both architectures.
#
# Action pins verified 2026-09-05 with `gh api repos/<o>/<r>/releases/latest`,
# each checked to run on Node 24, because Node 20 leaves GitHub runners in
# September 2026. astral-sh/setup-uv publishes no floating major tag after v7,
# so it is pinned to the exact release; the others resolve their major alias.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_plugin:
        description: >-
          Build the PJRT plugin in Docker instead of downloading the release
          asset (hours)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync the Python environment
        run: |
          set -euo pipefail
          # --locked only once a lock file is committed.
          if [ -f uv.lock ]; then
            uv sync --locked
          else
            uv sync
          fi

      # --no-sync: `uv run` would otherwise re-sync and undo the step above.
      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: shellcheck
        run: |
          set -euo pipefail
          # Preinstalled on the ubuntu-24.04 image; install it if that changes.
          command -v shellcheck >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends shellcheck
          }
          shellcheck --version
          shellcheck tools/*.sh examples/04_realtime/run_realtime.sh \
            examples/05_ros2_control/run.sh

  docs:
    name: docs (build only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The same steps as the build job in docs.yml, minus the deploy: a pull
      # request must fail on a broken cross-reference without touching Pages.
      - uses: actions/checkout@v7

      - name: Install doxygen
        run: |
          set -euo pipefail
          # conf.py runs doxygen during the sphinx build.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync the Python environment
        run: |
          set -euo pipefail
          if [ -f uv.lock ]; then
            uv sync --locked --extra docs
          else
            uv sync --extra docs
          fi

      # --no-sync: a bare `uv run` would re-sync without the docs extra and
      # remove sphinx out from under this command.
      - name: sphinx-build
        run: |
          uv run --no-sync sphinx-build -W --keep-going -b html \
            docs docs/_build/html

      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7

  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # aarch64 is a signal, not a gate: hosted arm64 runners are free for public
    # repositories, but the plugin asset for that architecture may lag.
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            required: true
          - runner: ubuntu-24.04-arm
            arch: aarch64
            required: false
    steps:
      # No submodules: third_party/xla is only needed by plugin.yml.
      - uses: actions/checkout@v7

      - name: Read the pinned versions
        id: versions
        run: |
          set -euo pipefail
          . ./versions.env
          echo "jax_version=${JAX_VERSION}" >> "$GITHUB_OUTPUT"
          echo "plugin_release=${PLUGIN_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "JAX ${JAX_VERSION}, plugin release ${PLUGIN_RELEASE}"

      - uses: docker/setup-buildx-action@v4

      # load: true tags the image locally, which is what the `ci` compose
      # service picks up. Cache scope per architecture: an x86_64 layer is
      # useless to the arm64 runner.
      - name: Build the dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          build-args: PLUGIN_SOURCE=none
          tags: call_jax_from_cpp:dev
          load: true
          cache-from: type=gha,scope=dev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.arch }}

      # Restore and save are split so a failed download is never cached.
      - name: Restore the cached plugin
        id: plugin-restore
        uses: actions/cache/restore@v6
        with:
          path: build/plugin
          key: plugin-${{ matrix.arch }}-${{ steps.versions.outputs.plugin_release }}-${{ hashFiles('tools/plugin_versions.txt') }}

      # No asset yet for this JAX version is a missing artifact, not a broken
      # tree, so it does not fail CI; get_plugin.sh prints the remedies.
      - name: Download the prebuilt plugin
        id: plugin-download
        if: steps.plugin-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        run: make plugin

      # Opt-in and slow (bazel compiles LLVM; more than this job's 90 minutes).
      # plugin.yml is the supported builder; this reproduces a build failure
      # under CI conditions.
      - name: Build the plugin from source in Docker
        if: >-
          ${{ inputs.build_plugin
          && steps.plugin-restore.outputs.cache-hit != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: plugin-export
          build-args: PLUGIN_SOURCE=source
          outputs: type=local,dest=build/plugin

      - name: Check whether a plugin is present
        id: plugin
        run: |
          set -euo pipefail
          if [ -f build/plugin/libpjrt_c_api_cpu_plugin.so ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            ls -l build/plugin
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the downloaded asset is cached: a source build under the release
      # key would hand later runs something other than the published artifact.
      - name: Save the plugin to the cache
        if: ${{ always() && steps.plugin-download.outcome == 'success' && steps.plugin.outputs.present == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: build/plugin
          key: ${{ steps.plugin-restore.outputs.cache-primary-key }}

      # --user root: the runner user is uid 1001, the image user 1000, and both
      # the bind mount and /opt/venv must be writable. Always, plugin or not:
      # nothing links against the plugin, and a job that skipped this would
      # turn a green badge into "ruff and sphinx passed". compose.yml asks for
      # CAP_SYS_NICE and the rtprio/memlock ulimits; whether SCHED_FIFO then
      # takes effect on a hosted VM is not relied on: every real-time step
      # reports [skip] without the privilege, nothing in CI gates on it, and a
      # latency number from a shared runner is not reportable either way.
      - name: make (compile everything)
        run: |
          docker compose -f docker/compose.yml run --rm --user root \
            ci make lib examples tests-cpp guard tools build/bin/bench

      # Also always: tests that need a plugin skip themselves with the reason.
      # PJRT_CPU_PLUGIN is redirected because the image was built with
      # PLUGIN_SOURCE=none; the fetched plugin lives in the bind mount.
      - name: make test
        run: |
          docker compose -f docker/compose.yml run --rm --user root \
            -e PJRT_CPU_PLUGIN=/workspace/build/plugin/libpjrt_c_api_cpu_plugin.so \
            ci make test

      # Example 05 needs a ROS 2 image rather than the dev one, artifacts/arm
      # (exported by `make test` above), and a plugin to load, which the arm64
      # runner has none of.
      - name: Build the ros2 image
        if: ${{ matrix.arch == 'x86_64' && steps.plugin.outputs.present == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ros2
          tags: call_jax_from_cpp:ros2
          load: true
          cache-from: type=gha,scope=ros2-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ros2-${{ matrix.arch }}

      # --user root as above: colcon writes into the bind mount.
      - name: Run example 05 under ros2_control
        if: ${{ matrix.arch == 'x86_64' && steps.plugin.outputs.present == 'true' }}
        run: |
          docker compose -f docker/compose.yml run --rm --user root \
            ros2 examples/05_ros2_control/run.sh --seconds 10

      - name: Note how much was skipped for want of a plugin
        if: ${{ always() && steps.plugin.outputs.present != 'true' }}
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE: ${{ steps.versions.outputs.plugin_release }}
        run: |
          echo "::warning title=no plugin::the tree compiled and the plugin-free tests ran, but everything needing a PJRT CPU plugin skipped (no asset for ${ARCH} at release ${RELEASE}). Publish one with tools/release_plugin.sh, or re-run with build_plugin=true."

      # The container wrote as root; hand the tree back for the upload and the
      # runner's cleanup.
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.arch }}
          path: artifacts/reports/
          if-no-files-found: ignore
          retention-days: 14
