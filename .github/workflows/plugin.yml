# Build the PJRT CPU plugin from the XLA fork and publish it as a release
# asset, one per architecture.
#
# A from-scratch XLA build compiles LLVM, and on a 4-vCPU hosted runner that
# takes hours. tools/release_plugin.sh on a developer machine is the primary
# producer; this workflow is the reproducible secondary path, and fills in an
# architecture the developer machine does not have. timeout-minutes is 355
# because the hard limit is 360, and a job killed at the limit says nothing
# about why it was slow.
#
# Action pins verified 2026-09-05 as in ci.yml. bazel-contrib/setup-bazel
# publishes no floating major tag (its releases are 0.x), so it is pinned to
# the exact release.

name: plugin

on:
  workflow_dispatch:
    inputs:
      jax_version:
        description: "JAX version to build the plugin for, e.g. 0.11.0"
        required: true
        type: string
      build_mode:
        description: >-
          bazel -c mode. Measured to be irrelevant to call latency (p50 moved
          0.2% between opt and fastbuild), because the compute kernels are
          LLVM-compiled at export time and embedded in the artifact; opt is
          what ships.
        type: choice
        options: [opt, fastbuild]
        default: opt
      publish:
        description: "Publish a GitHub release with the built assets"
        type: boolean
        default: true
  push:
    tags: ["plugin-jax-v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    strategy:
      # One architecture failing must not cancel the other; the missing one
      # can be added to the release later with tools/release_plugin.sh.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      # With the submodule: third_party/xla is the tree bazel builds, so the
      # fork branch must be pushed first (docs/developer/bumping-jax.md).
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Resolve the version and the fork commit
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.jax_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            version="${REF_NAME#plugin-jax-v}"
          fi
          . ./versions.env
          # build_plugin.sh names the tarball from versions.env, so a version
          # that disagrees with the tree would contradict the release tag.
          if [ "${version}" != "${JAX_VERSION}" ]; then
            echo "::error::asked for JAX ${version} but versions.env pins ${JAX_VERSION}; bump the tree first (docs/developer/bumping-jax.md)"
            exit 1
          fi
          fork_commit="$(git -C third_party/xla rev-parse HEAD)"
          if [ -n "${XLA_FORK_COMMIT:-}" ] && \
             [ "${fork_commit}" != "${XLA_FORK_COMMIT}" ]; then
            echo "::warning::submodule is at ${fork_commit} but versions.env records ${XLA_FORK_COMMIT}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "fork_commit=${fork_commit}" >> "$GITHUB_OUTPUT"
          {
            echo "JAX ${version}"
            echo "XLA commit ${XLA_COMMIT}"
            echo "fork ${XLA_FORK_BRANCH} @ ${fork_commit}"
          } >> "$GITHUB_STEP_SUMMARY"

      # bazel wants ~25G; the root disk has less with the preinstalled
      # toolchains in place.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install the build dependencies
        run: |
          set -euo pipefail
          # liblapack/libblas for the fork's LAPACK FFI kernels; xxd and
          # python3-dev for XLA's own build rules.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld liblapack-dev libblas-dev xxd python3-dev

      # The hosted x86_64 runners mount a large temporary disk at /mnt; the
      # arm64 image may not.
      - name: Point the bazel output base at /mnt when it exists
        run: |
          set -euo pipefail
          if [ -d /mnt ] && sudo mkdir -p /mnt/bazel 2>/dev/null; then
            sudo chown "$(id -u):$(id -g)" /mnt/bazel
            echo "BAZEL_STARTUP_ARGS=--output_user_root=/mnt/bazel" >> "$GITHUB_ENV"
            echo "bazel output base: /mnt/bazel ($(df -h /mnt | tail -1))"
          else
            echo "no writable /mnt; leaving the output base under \$HOME"
          fi

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # XLA is the bazel module, not the repository root; the caches key
          # on it.
          module-root: third_party/xla
          bazelisk-cache: true
          repository-cache: true
          disk-cache: plugin-${{ matrix.arch }}
          bazelrc: |
            # 4 vCPU; the LLVM link steps are OOM-killed if bazel assumes all
            # of RAM.
            build --jobs=4
            build --local_resources=memory=HOST_RAM*.7

      - name: Build and package the plugin
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'opt' }}
        run: |
          set -euo pipefail
          # No ARCH_FLAGS: release assets are built baseline so they run on any
          # machine of that architecture; the artifacts are the ISA-locked part.
          tools/build_plugin.sh --package --mode "${BUILD_MODE}"

      # Bazel's own disk-cache GC is behind experimental flags, so trim to 5G
      # here before setup-bazel saves the directory: this cache alone would
      # otherwise evict everything else under the repository's 10G limit.
      - name: Cap the bazel disk cache
        if: always()
        run: |
          set -euo pipefail
          cache="$(grep -ho -- '--disk_cache=[^ ]*' "$HOME/.bazelrc" 2>/dev/null | tail -1 | cut -d= -f2- || true)"
          cache="${cache/#\~/$HOME}"
          if [ -z "${cache}" ] || [ ! -d "${cache}" ]; then
            echo "no disk cache to cap"
            exit 0
          fi
          limit=$((5 * 1024 * 1024 * 1024))
          total="$(du -sb "${cache}" | cut -f1)"
          echo "disk cache ${cache}: ${total} bytes"
          if [ "${total}" -gt "${limit}" ]; then
            # Oldest first, deleting until the total is under the limit.
            find "${cache}" -type f -printf '%T@\t%s\t%p\n' \
              | sort -n \
              | awk -F'\t' -v total="${total}" -v limit="${limit}" \
                  '{ if (total <= limit) exit; total -= $2; print $3 }' \
              | xargs -r -d '\n' rm -f
            echo "capped to $(du -sh "${cache}" | cut -f1)"
          fi

      - name: Upload the plugin tarball
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.arch }}
          path: |
            build/plugin/*.tar.gz
            build/plugin/*.tar.gz.sha256
            build/plugin/PLUGIN_INFO.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: build
    # !cancelled() rather than always(): publish whatever did build, but a
    # cancelled run publishes nothing.
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve the version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.jax_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            version="${REF_NAME#plugin-jax-v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: plugin-*

      - name: Assemble the release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ls -R dist
          {
            cat <<NOTES
          PJRT CPU plugin for JAX ${VERSION}.

          Built from the XLA fork, which adds jaxlib's LAPACK FFI kernels and
          the CPU plugin create options. Install it with \`make plugin\`, which
          verifies the sha256 recorded in tools/plugin_versions.txt.
          NOTES
            echo
            for info in dist/*/PLUGIN_INFO.txt; do
              [ -f "${info}" ] || continue
              echo "## $(basename "$(dirname "${info}")")"
              echo
              echo '```'
              cat "${info}"
              echo '```'
              echo
            done
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: plugin-jax-v${{ steps.ver.outputs.version }}
          name: PJRT CPU plugin for JAX ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*/*.tar.gz
            dist/*/*.tar.gz.sha256
          # A release with no assets is a silent failure: the manifest row it
          # is meant to feed would point at nothing.
          fail_on_unmatched_files: true
          # "latest" must keep meaning the latest source release.
          make_latest: "false"
