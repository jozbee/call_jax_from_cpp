# Development and CI containers.
#
#   docker compose -f docker/compose.yml run --rm dev            interactive
#   docker compose -f docker/compose.yml run --rm ci make test    the CI path
#   docker compose -f docker/compose.yml run --rm plugin-builder \
#       tools/build_plugin.sh                                     build the plugin
#   docker compose -f docker/compose.yml run --rm ros2 \
#       examples/05_ros2_control/run.sh --seconds 8               example 05
#
# The real-time helpers in include/pjrt_exec/rt.hpp need privileges a default
# container does not have: SCHED_FIFO needs CAP_SYS_NICE plus an rtprio limit,
# and mlockall needs an unlimited memlock. They are granted to `dev` and `ci`
# so the hardening path can be exercised. Container timings are relative
# signals only; real numbers come from bare metal.
x-rt-privileges: &rt-privileges
  cap_add:
    - SYS_NICE
  ulimits:
    rtprio: 99
    memlock: -1

x-build: &build
  context: ..
  dockerfile: docker/Dockerfile
  args:
    PLUGIN_SOURCE: ${PLUGIN_SOURCE:-none}

services:
  dev:
    build: *build
    image: call_jax_from_cpp:dev
    volumes:
      - ..:/workspace
      - bazel-cache:/home/dev/.cache/bazel
    working_dir: /workspace
    tty: true
    stdin_open: true
    <<: *rt-privileges
    # For a latency run, give the container its own cores and keep everything
    # else off them, e.g.
    # cpuset: "2-5"

  ci:
    build: *build
    image: call_jax_from_cpp:dev
    volumes:
      - ..:/workspace
    working_dir: /workspace
    command: ["make", "test"]
    <<: *rt-privileges

  # ROS 2 Jazzy, for examples/05_ros2_control only: no JAX, no bazel, no
  # plugin baked in. The controller is built with colcon against the bind
  # mount, and loads the plugin and the artifacts from there.
  ros2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    image: call_jax_from_cpp:ros2
    volumes:
      - ..:/workspace
    working_dir: /workspace
    tty: true
    stdin_open: true
    <<: *rt-privileges

  # No real-time privileges: this one only runs bazel. XLA_SRC lets a local
  # working tree be built before the fork branch is pushed.
  plugin-builder:
    build: *build
    image: call_jax_from_cpp:dev
    volumes:
      - ..:/workspace
      - ${XLA_SRC:-../third_party/xla}:/xla
      - bazel-cache:/home/dev/.cache/bazel
    working_dir: /workspace
    environment:
      XLA_DIR: /xla
      BUILD_MODE: ${BUILD_MODE:-opt}
    command: ["tools/build_plugin.sh"]

volumes:
  bazel-cache: {}
