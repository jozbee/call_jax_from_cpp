# The real-time helpers in `src/pjrt_exec/rt.hpp` need privileges a default
# container does not have: SCHED_FIFO needs CAP_SYS_NICE plus an rtprio limit,
# and mlockall needs an unlimited memlock. They are granted here so the
# hardening path can be exercised in development; note that container timings
# are only ever relative signals, with real numbers coming from bare metal.
x-rt-privileges: &rt-privileges
  cap_add:
    - SYS_NICE
  ulimits:
    rtprio: 99
    memlock: -1

services:
  ubuntu-amd64:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    image: call_jax_from_cpp:ubuntu24.04-amd64
    container_name: jax_from_cpp_amd64
    volumes:
      - ..:/workspace
    working_dir: /workspace
    tty: true
    stdin_open: true
    <<: *rt-privileges
    # For a latency run, give the container its own cores and keep everything
    # else off them, e.g.
    # cpuset: "2-5"

  ubuntu-arm64:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    image: call_jax_from_cpp:ubuntu24.04-arm64
    container_name: jax_from_cpp_arm64
    volumes:
      - ..:/workspace
    working_dir: /workspace
    tty: true
    stdin_open: true
    <<: *rt-privileges
    # cpuset: "2-5"
